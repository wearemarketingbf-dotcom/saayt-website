name: Unpack bundle and deploy
# Uploading files into bundle/ from the GitHub web UI triggers this workflow
# It unpacks the source bundle into the repo, commits it and deploys the preview to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['bundle/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle
        run: |
          if [ -d bundle ] && ls bundle/site.zip.part-* >/dev/null 2>&1; then
            cat bundle/site.zip.part-* > /tmp/site.zip
            rm -rf bundle
            unzip -o -q /tmp/site.zip -d .
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack site bundle" || echo "nothing to commit"
            git push
          fi
  build:
    needs: unpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          SITE_URL: https://saayt.app
          BASE_PATH: /
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

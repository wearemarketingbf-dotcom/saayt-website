# Sveltia CMS for saayt.app · https://sveltiacms.app/en/docs
# Editors sign in with a GitHub personal access token (repo write access). Every save is a commit to main,
# and the deploy workflow publishes it in about two minutes
# Field order follows the order of the keys in the files, so a save keeps the files tidy

backend:
  name: github
  repo: wearemarketingbf-dotcom/saayt-website
  branch: main
  auth_methods: [token]
  commit_messages:
    create: 'CMS: add {{collection}} {{slug}}'
    update: 'CMS: update {{collection}} {{slug}}'
    delete: 'CMS: delete {{collection}} {{slug}}'
    uploadMedia: 'CMS: upload {{path}}'
    deleteMedia: 'CMS: delete {{path}}'

app_title: صيت · إدارة المحتوى
site_url: https://saayt.app
logo:
  src: /favicon.svg
show_preview_links: true

media_folder: public/media
public_folder: /media
media_libraries:
  default:
    config:
      max_file_size: 15728640 # 15 MB, enough for a short MP4
      slugify_filename: true
      transformations:
        raster_image: { format: webp, quality: 85, width: 2400 }

i18n:
  structure: multiple_files
  locales: [ar, en]
  default_locale: ar
  omit_default_locale_from_preview_path: true # Arabic lives at the site root

output:
  omit_empty_optional_fields: true

collections:
  # ───────────── المدونة ─────────────
  - name: blog
    label: المدونة
    label_singular: مقال
    icon: article
    description: كل مقال له نسخة عربية ونسخة إنجليزية بنفس الرابط · الحفظ ينشر المقال على الموقع خلال دقائق
    folder: src/content/blog/{{locale}}
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: [date, title]
    preview_path: /{{locale}}/blog/{{fields.slug}}/
    i18n: true
    fields:
      - { name: title, label: عنوان المقال, widget: string, i18n: true, hint: يظهر في أعلى المقال وعلى بطاقته }
      - { name: description, label: وصف قصير, widget: text, i18n: true, maxlength: 160, hint: يظهر تحت العنوان وفي نتائج البحث · 160 حرفًا أو أقل }
      - { name: date, label: تاريخ النشر, widget: datetime, type: date, format: YYYY-MM-DD, i18n: duplicate }
      - { name: updated, label: تاريخ آخر تحديث, widget: datetime, type: date, format: YYYY-MM-DD, i18n: duplicate, required: false }
      - name: slug
        label: رابط المقال
        widget: string
        i18n: duplicate
        hint: حروف إنجليزية صغيرة وأرقام وشرطات فقط مثل ramadan-hours · نفس الرابط للعربي والإنجليزي ويصير saayt.app/blog/الرابط · لا تغيّره بعد النشر
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'حروف إنجليزية صغيرة وأرقام وشرطات فقط']
      - { name: lang, widget: hidden, default: '{{locale}}', i18n: true }
      - { name: readingTime, label: مدة القراءة بالدقائق, widget: number, value_type: int, min: 1, max: 60, i18n: duplicate }
      - name: tags
        label: الوسوم
        label_singular: وسم
        widget: list
        i18n: true
        hint: الوسم الأول يظهر على بطاقة المقال
        field: { name: tag, label: وسم, widget: string, i18n: true }
      - { name: cover, label: صورة الغلاف, widget: image, i18n: duplicate, hint: تظهر على بطاقة المقال في المدونة · الصورة ترتفع إلى مكتبة الوسائط وتتحول إلى WebP }
      - { name: coverAlt, label: وصف صورة الغلاف, widget: string, i18n: true, hint: جملة تصف الصورة لمن لا يراها مثل «واجهة محل مضاءة ليلًا» · إلزامي }
      - &seo_override
        name: seo
        label: SEO
        widget: object
        i18n: true
        required: false
        collapsed: true
        hint: اختياري · الخانات الفارغة تأخذ العنوان والوصف وصورة الموقع الافتراضية
        fields:
          - { name: title, label: عنوان البحث, widget: string, i18n: true, required: false, maxlength: 60, hint: يظهر في نتائج البحث وتبويب المتصفح · 60 حرفًا أو أقل }
          - { name: description, label: وصف البحث, widget: text, i18n: true, required: false, maxlength: 160, hint: 160 حرفًا أو أقل }
          - { name: image, label: صورة المشاركة, widget: image, i18n: true, required: false, hint: تظهر عند مشاركة الرابط في واتساب وX · مقاس 1200×630 }
          - { name: noindex, label: إخفاء من محركات البحث, widget: boolean, i18n: true, required: false }
      - { name: body, label: نص المقال, widget: richtext, i18n: true, hint: العناوين من المستوى الثاني تصير فهرس المقال · كل صورة داخل النص تحتاج وصفًا }

  # ───────────── المزايا ─────────────
  - name: features
    label: المزايا
    icon: widgets
    description: صفحة لكل ميزة · الاسم والسطر القصير يظهران في القائمة والفوتر وبطاقات المزايا
    format: json
    i18n: true
    editor: { preview: false }
    files:
      - name: hours
        label: المواعيد والمواسم
        file: src/data/features/{{locale}}/hours.json
        i18n: true
        preview_path: /{{locale}}/features/hours/
        fields: &feature_fields
          - name: nav
            label: الاسم في القائمة والبطاقات
            widget: object
            i18n: true
            fields:
              - { name: t, label: الاسم, widget: string, i18n: true }
              - { name: d, label: سطر قصير, widget: string, i18n: true }
          - &seo_page
            name: seo
            label: SEO
            widget: object
            i18n: true
            collapsed: true
            summary: '{{fields.title}}'
            fields: &seo_fields
              - { name: title, label: عنوان البحث, widget: string, i18n: true, maxlength: 60, hint: يظهر في نتائج البحث وتبويب المتصفح · 60 حرفًا أو أقل }
              - { name: description, label: وصف البحث, widget: text, i18n: true, maxlength: 160, hint: يظهر تحت العنوان في نتائج البحث · 160 حرفًا أو أقل }
              - { name: image, label: صورة المشاركة, widget: image, i18n: true, required: false, hint: تظهر عند مشاركة الرابط في واتساب وX · مقاس 1200×630 · فارغة تعني صورة الموقع الافتراضية }
              - { name: noindex, label: إخفاء من محركات البحث, widget: boolean, i18n: true, required: false }
          - { name: eyebrow, label: العنوان الصغير فوق العنوان, widget: string, i18n: true }
          - { name: h1, label: العنوان الرئيسي, widget: string, i18n: true }
          - { name: lead, label: الفقرة الأولى, widget: text, i18n: true }
          - name: why
            label: قسم ليش
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: h2, label: عنوان القسم, widget: string, i18n: true }
              - name: items
                label: النقاط
                label_singular: نقطة
                widget: list
                i18n: true
                summary: '{{fields.t}}'
                fields: &td
                  - { name: t, label: العنوان, widget: string, i18n: true }
                  - { name: d, label: الشرح, widget: text, i18n: true }
          - name: caps
            label: قسم وش تقدر تسوي
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: h2, label: عنوان القسم, widget: string, i18n: true }
              - name: items
                label: الإمكانيات
                label_singular: إمكانية
                widget: list
                i18n: true
                summary: '{{fields.t}}'
                fields:
                  - &icon { name: icon, label: الأيقونة, widget: select, i18n: duplicate, options: [clock, reply, bell, pin, chart, check, shield, user, globe, moon, photo, phone, mail, spark, layers, team, lock, calendar, store, search] }
                  - { name: t, label: العنوان, widget: string, i18n: true }
                  - { name: d, label: الشرح, widget: text, i18n: true }
          - name: flow
            label: قسم الخطوات
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: h2, label: عنوان القسم, widget: string, i18n: true }
              - { name: steps, label: الخطوات, label_singular: خطوة, widget: list, i18n: true, summary: '{{fields.t}}', fields: *td }
          - name: guard
            label: صندوق الضمان
            widget: object
            i18n: true
            collapsed: true
            fields: *td
          - &faq_list
            name: faq
            label: الأسئلة الشائعة
            label_singular: سؤال
            widget: list
            i18n: true
            collapsed: true
            summary: '{{fields.q}}'
            fields: &qa
              - { name: q, label: السؤال, widget: string, i18n: true, hint: علامة الاستفهام في آخر السؤال فقط }
              - { name: a, label: الجواب, widget: text, i18n: true }
      - { name: reviews, label: الردود على التقييمات, file: 'src/data/features/{{locale}}/reviews.json', i18n: true, preview_path: '/{{locale}}/features/reviews/', fields: *feature_fields }
      - { name: alerts, label: تنبيهات الفروع, file: 'src/data/features/{{locale}}/alerts.json', i18n: true, preview_path: '/{{locale}}/features/alerts/', fields: *feature_fields }
      - { name: photos-details, label: بيانات الفروع والصور, file: 'src/data/features/{{locale}}/photos-details.json', i18n: true, preview_path: '/{{locale}}/features/photos-details/', fields: *feature_fields }
      - { name: branch-score, label: مؤشر الفرع, file: 'src/data/features/{{locale}}/branch-score.json', i18n: true, preview_path: '/{{locale}}/features/branch-score/', fields: *feature_fields }

  # ───────────── القطاعات ─────────────
  - name: industries
    label: القطاعات
    icon: storefront
    description: صفحة لكل قطاع · المثال في كل صفحة توضيحي ومكتوب عليه أنه مثال
    format: json
    i18n: true
    editor: { preview: false }
    files:
      - name: clinics
        label: العيادات والمجمعات الطبية
        file: src/data/industries/{{locale}}/clinics.json
        i18n: true
        preview_path: /{{locale}}/industries/clinics/
        fields: &industry_fields
          - { name: name, label: اسم القطاع, widget: string, i18n: true, hint: يظهر في القائمة والفوتر والبطاقات }
          - { name: img, label: صورة القطاع, widget: image, i18n: duplicate, hint: صورة البطاقة وخلفية أعلى الصفحة · زخرفية لأن اسم القطاع مكتوب فوقها لذلك ما تحتاج وصفًا }
          - *seo_page
          - { name: h1, label: العنوان الرئيسي, widget: string, i18n: true }
          - { name: lead, label: الفقرة الأولى, widget: text, i18n: true }
          - { name: pains, label: التحديات, label_singular: تحدي, widget: list, i18n: true, summary: '{{fields.t}}', collapsed: true, fields: *td }
          - name: helps
            label: كيف يساعد صيت
            label_singular: ميزة
            widget: list
            i18n: true
            collapsed: true
            summary: '{{fields.slug}}'
            fields:
              - { name: slug, label: الميزة, widget: select, i18n: duplicate, options: [{ label: المواعيد والمواسم, value: hours }, { label: الردود على التقييمات, value: reviews }, { label: تنبيهات الفروع, value: alerts }, { label: بيانات الفروع والصور, value: photos-details }, { label: مؤشر الفرع, value: branch-score }] }
              - { name: d, label: الشرح, widget: text, i18n: true }
          - name: example
            label: مثال تقييم ورد
            widget: object
            i18n: true
            collapsed: true
            hint: مثال توضيحي يظهر عليه وسم «مثال» · لا تكتب اسم عميل حقيقي
            fields:
              - { name: branch, label: اسم الفرع في المثال, widget: string, i18n: true }
              - { name: stars, label: عدد النجوم في المثال, widget: number, value_type: int, min: 1, max: 5, i18n: duplicate }
              - { name: review, label: نص التقييم, widget: text, i18n: true }
              - { name: reply, label: الرد المقترح, widget: text, i18n: true }
              - { name: note, label: ملاحظة تحت الرد, widget: string, i18n: true }
          - name: seasons
            label: المواسم
            label_singular: موسم
            widget: list
            i18n: true
            field: { name: season, label: موسم, widget: string, i18n: true }
          - *faq_list
      - { name: salons, label: الصالونات والسبا, file: 'src/data/industries/{{locale}}/salons.json', i18n: true, preview_path: '/{{locale}}/industries/salons/', fields: *industry_fields }
      - { name: auto-service, label: مراكز خدمة السيارات, file: 'src/data/industries/{{locale}}/auto-service.json', i18n: true, preview_path: '/{{locale}}/industries/auto-service/', fields: *industry_fields }
      - { name: optics, label: محلات البصريات, file: 'src/data/industries/{{locale}}/optics.json', i18n: true, preview_path: '/{{locale}}/industries/optics/', fields: *industry_fields }
      - { name: perfume, label: العطور والعود, file: 'src/data/industries/{{locale}}/perfume.json', i18n: true, preview_path: '/{{locale}}/industries/perfume/', fields: *industry_fields }
      - { name: gold-jewelry, label: الذهب والمجوهرات, file: 'src/data/industries/{{locale}}/gold-jewelry.json', i18n: true, preview_path: '/{{locale}}/industries/gold-jewelry/', fields: *industry_fields }

  # ───────────── الصفحات القانونية ─────────────
  - name: legal
    label: الصفحات القانونية
    icon: gavel
    description: مسودات تحتاج مراجعة محامٍ سعودي · الملاحظة بين <!-- و --> في أول النص للفريق فقط ولا تظهر في الموقع
    format: yaml-frontmatter
    i18n: true
    files:
      - name: privacy
        label: سياسة الخصوصية
        file: src/content/legal/{{locale}}/privacy.md
        i18n: true
        preview_path: /{{locale}}/privacy/
        fields: &legal_fields
          - { name: title, label: العنوان, widget: string, i18n: true }
          - { name: description, label: وصف البحث, widget: text, i18n: true, maxlength: 160, hint: يظهر في نتائج البحث · 160 حرفًا أو أقل }
          - { name: lang, widget: hidden, default: '{{locale}}', i18n: true }
          - { name: updated, label: آخر تحديث, widget: datetime, type: date, format: YYYY-MM-DD, i18n: duplicate, hint: يظهر في أعلى الصفحة }
          - *seo_override
          - { name: body, label: النص, widget: richtext, i18n: true, modes: [raw, rich_text], hint: يفتح على وضع Markdown حتى تبقى ملاحظة المسودة كما هي }
      - { name: terms, label: الشروط والأحكام, file: 'src/content/legal/{{locale}}/terms.md', i18n: true, preview_path: '/{{locale}}/terms/', fields: *legal_fields }

singletons:
  # ───────────── الصفحات ─────────────
  - name: home
    label: الصفحة الرئيسية
    icon: home
    file: src/data/home/{{locale}}.json
    format: json
    i18n: true
    preview_path: /{{locale}}/
    editor: { preview: false }
    fields:
      - *seo_page
      - name: hero
        label: الواجهة الأولى
        widget: object
        i18n: true
        collapsed: true
        fields:
          - { name: eyebrow, label: العنوان الصغير, widget: string, i18n: true }
          - { name: h1a, label: العنوان · السطر الأول, widget: string, i18n: true }
          - { name: h1b, label: العنوان · السطر الثاني, widget: string, i18n: true }
          - { name: sub, label: الفقرة, widget: text, i18n: true }
          - { name: cta1, label: الزر الرئيسي, widget: string, i18n: true }
          - { name: cta2, label: الزر الثاني, widget: string, i18n: true }
          - { name: note, label: سطر الطمأنة تحت الأزرار, widget: string, i18n: true }
          - name: media
            label: الفيديو الخلفي
            widget: object
            i18n: duplicate
            collapsed: true
            hint: فيديو قصير صامت يتكرر خلف الواجهة · الصورة تظهر قبل ما يشتغل
            fields:
              - { name: poster, label: صورة قبل التشغيل, widget: image, i18n: duplicate }
              - { name: videoSm, label: فيديو الجوال MP4, widget: file, accept: video/mp4, i18n: duplicate }
              - { name: video, label: فيديو الشاشات الكبيرة MP4, widget: file, accept: video/mp4, i18n: duplicate }
      - name: heroCard
        label: بطاقة المثال في الواجهة
        widget: object
        i18n: true
        collapsed: true
        hint: مثال توضيحي عليه وسم «مثال توضيحي»
        fields:
          - { name: label, label: الوسم, widget: string, i18n: true }
          - { name: today, label: عنوان البطاقة, widget: string, i18n: true }
          - { name: branch, label: اسم الفرع, widget: string, i18n: true }
          - { name: time, label: الوقت, widget: string, i18n: true }
          - { name: review, label: التقييم, widget: text, i18n: true }
          - { name: suggested, label: عنوان الرد المقترح, widget: string, i18n: true }
          - { name: reply, label: الرد المقترح, widget: text, i18n: true }
          - { name: approve, label: زر الاعتماد, widget: string, i18n: true }
          - { name: edit, label: زر التعديل, widget: string, i18n: true }
          - { name: waiting, label: حالة الانتظار, widget: string, i18n: true }
          - { name: approved, label: حالة بعد الاعتماد, widget: string, i18n: true }
          - name: rows
            label: صفوف الفروع
            label_singular: صف
            widget: list
            i18n: true
            summary: '{{fields.b}}'
            fields:
              - { name: b, label: الفرع, widget: string, i18n: true }
              - { name: s, label: الحالة, widget: string, i18n: true }
              - { name: tone, label: لون النقطة, widget: select, i18n: duplicate, options: [{ label: زعفراني يحتاج انتباه, value: accent }, { label: أخضر تمام, value: ok }] }
      - name: trust
        label: شريط الثقة
        label_singular: جملة
        widget: list
        i18n: true
        collapsed: true
        field: { name: line, label: جملة, widget: string, i18n: true }
      - name: problem
        label: قسم المشكلة
        widget: object
        i18n: true
        collapsed: true
        fields:
          - &eyebrow { name: eyebrow, label: العنوان الصغير, widget: string, i18n: true }
          - &h2 { name: h2, label: عنوان القسم, widget: string, i18n: true }
          - &lead { name: lead, label: الفقرة, widget: text, i18n: true }
          - { name: before, label: عنوان قبل, widget: string, i18n: true }
          - { name: beforeCap, label: وصف قبل, widget: string, i18n: true }
          - { name: after, label: عنوان بعد, widget: string, i18n: true }
          - { name: afterCap, label: وصف بعد, widget: string, i18n: true }
          - { name: pains, label: المشاكل, label_singular: مشكلة, widget: list, i18n: true, summary: '{{fields.t}}', fields: *td }
      - name: concept
        label: قسم الفكرة
        widget: object
        i18n: true
        collapsed: true
        fields:
          - *eyebrow
          - *h2
          - *lead
          - { name: points, label: النقاط, label_singular: نقطة, widget: list, i18n: true, summary: '{{fields.t}}', fields: *td }
      - name: how
        label: قسم كيف يعمل
        widget: object
        i18n: true
        collapsed: true
        fields:
          - *eyebrow
          - *h2
          - { name: steps, label: الخطوات, label_singular: خطوة, widget: list, i18n: true, summary: '{{fields.t}}', fields: *td }
          - { name: more, label: رابط التفاصيل, widget: string, i18n: true }
      - name: features
        label: قسم المزايا
        widget: object
        i18n: true
        collapsed: true
        fields:
          - *eyebrow
          - *h2
          - name: hours
            label: المواعيد والمواسم
            widget: object
            i18n: true
            collapsed: true
            fields: &feature_row_fields
              - { name: t, label: الوسم, widget: string, i18n: true }
              - { name: h, label: العنوان, widget: string, i18n: true }
              - { name: d, label: الفقرة, widget: text, i18n: true }
              - { name: bullets, label: النقاط, label_singular: نقطة, widget: list, i18n: true, field: { name: bullet, label: نقطة, widget: string, i18n: true } }
          - { name: reviews, label: الردود على التقييمات, widget: object, i18n: true, collapsed: true, fields: *feature_row_fields }
          - { name: alerts, label: التنبيهات ومؤشر الفرع, widget: object, i18n: true, collapsed: true, fields: *feature_row_fields }
          - { name: details, label: البيانات والصور, widget: object, i18n: true, collapsed: true, fields: *feature_row_fields }
          - { name: cta, label: نص رابط اعرف أكثر, widget: string, i18n: true }
      - name: film
        label: قسم الفيلم
        widget: object
        i18n: true
        collapsed: true
        fields:
          - *eyebrow
          - *h2
          - { name: play, label: وصف زر التشغيل لقارئ الشاشة, widget: string, i18n: true }
          - { name: caption, label: السطر تحت الفيلم, widget: string, i18n: true }
          - name: media
            label: ملف الفيلم
            widget: object
            i18n: duplicate
            collapsed: true
            fields:
              - { name: poster, label: صورة قبل التشغيل, widget: image, i18n: duplicate }

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>صيت · إدارة المحتوى</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link href="config.yml" type="application/yaml" rel="cms-config-url" />
</head>
<body data-pagefind-ignore="all">
  <!-- Sveltia CMS, pinned version from jsDelivr with a matching integrity hash. To upgrade, change the version
       in the URL and replace the hash with the new file's sha384 -->
  <script src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.249.1/dist/sveltia-cms.js" integrity="sha384-VhZk/YeX34ZYE+93UVhm08o5GOb4MUn5knQmsTNyyFuUxmlBju1CRVvTP886DH3u" crossorigin="anonymous"></script>
  <script>
    // «رسائل التواصل»: contact messages stay in the CRM and email, never in this repo. The page explains that
    // and links to the CRM inbox set in Site settings (crmInboxUrl)
    window.CMS?.registerCustomPage({ id: 'contact-messages', label: 'رسائل التواصل', icon: 'mail', url: new URL('contact-messages/', location.href).href });
  </script>
</body>
</html>
